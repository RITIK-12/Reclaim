[project]
name = "reclaim"
version = "0.1.0"
description = "Autonomous returns-disposition agent: Liquid sees, Nimble prices, RawTree remembers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=0.6",
  "langchain-openai>=0.3",
  "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "duckdb>=1.1",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
